name: US100 VWAP Trading Bot

on:
  schedule:
    # Broad UTC coverage; the application enforces the 10:00-15:00
    # America/New_York window and therefore handles both DST regimes.
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trade-lab-live-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare state cache key
        id: state
        shell: bash
        run: |
          state_date="$(TZ=America/New_York date +%F)"
          echo "date=$state_date" >> "$GITHUB_OUTPUT"
          echo "key=trade-state-$state_date-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Restore latest state for the New York trading day
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state/state.json
            .state/state.json.bak
          key: ${{ steps.state.outputs.key }}
          restore-keys: |
            trade-state-${{ steps.state.outputs.date }}-

      # A cache miss before 10:00 New York time is the only safe first-run
      # bootstrap window. During the session, a miss could mean eviction and
      # loss of today's alert history, so fail closed.
      - name: Validate or bootstrap state cache
        if: github.event_name == 'schedule'
        env:
          CACHE_MATCHED_KEY: ${{ steps.restore_state.outputs['cache-matched-key'] }}
        run: |
          python -m trade_lab.cache_guard --matched-key "$CACHE_MATCHED_KEY" --state-file .state/state.json

      - name: Run live monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STATE_FILE: .state/state.json
          TRADE_LAB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m trade_lab.live --prepare-alert
          else
            python -m trade_lab.live --dry-run
          fi

      # Commit the pending intent to the cache before making the external
      # Telegram side effect. If the runner dies after delivery, the next run
      # sees the pending intent and quarantines it instead of sending again.
      - name: Checkpoint state before Telegram delivery
        if: success() && github.event_name == 'schedule' && hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .state/state.json
            .state/state.json.bak
          key: ${{ steps.state.outputs.key }}-checkpoint

      - name: Deliver checkpointed alert
        if: success() && github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STATE_FILE: .state/state.json
          TRADE_LAB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m trade_lab.live --deliver-pending

      # Final cache contains the confirmed sent/rejected/unknown outcome.
      # If the runner is interrupted during delivery, the earlier checkpoint
      # remains and the next run will not automatically resend it.
      - name: Save final state for subsequent scheduled runs
        if: success() && github.event_name == 'schedule' && hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .state/state.json
            .state/state.json.bak
          key: ${{ steps.state.outputs.key }}-final
